# Template da Fase 5. Renderizado por scripts/fase5-tls.sh.
# PROD: __APP_IP__=10.10.10.11 / __HTTPS_PORT__=8444
# DEV:  __APP_IP__=10.10.20.11 / __HTTPS_PORT__=8445
server {
    listen 80;
    server_name _;
    return 301 https://__SITE_HOST__$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/servico.crt;
    ssl_certificate_key /etc/nginx/ssl/servico.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 512M;

    location / {
        proxy_pass http://__APP_IP__;
        proxy_http_version 1.1;
        proxy_set_header Host __SITE_HOST__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host __SITE_HOST__;
        proxy_set_header Connection "";
    }
}
